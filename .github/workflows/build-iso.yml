name: Build NEXUS OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux syslinux-utils syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Run Build Script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Calculate Checksums
        run: |
          cd build
          if compgen -G "*.iso" > /dev/null; then
            for f in *.iso; do
              cp "${f}" nexus-os-2026-x86_64.iso 2>/dev/null || true
              break
            done
            sha256sum *.iso > SHA256SUMS.txt
          else
            echo "NEXUS OS Live-Build log" > nexus-os-status.txt
            sha256sum nexus-os-status.txt > SHA256SUMS.txt
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-iso
          path: |
            build/*.iso
            build/SHA256SUMS.txt
            build/nexus-os-status.txt
          if-no-files-found: warn
