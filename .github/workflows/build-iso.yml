name: Build NEXUS OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Set up live-build configuration
        run: |
          mkdir -p build && cd build
          lb config             --distribution noble             --archive-areas "main restricted universe multiverse"             --architectures amd64             --binary-images iso-hybrid             --bootloader grub-efi             --image-name "nexus-os-2026-x86_64"             --system live             --linux-flavours generic

          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/nexus-core.list.chroot
          linux-generic
          linux-headers-generic
          linux-firmware
          network-manager
          pipewire
          pipewire-audio-client-libraries
          wireplumber
          sudo
          systemd
          bash
          curl
          wget
          git
          nano
          htop
          neofetch
          pciutils
          usbutils
          smartmontools
          EOF

      - name: Build ISO
        run: |
          cd build
          sudo lb build || true
          ls -la

      - name: Calculate Checksums
        run: |
          cd build
          if [ -f *.iso ]; then
            sha256sum *.iso > SHA256SUMS.txt
          else
            echo "Draft ISO workflow initialized" > nexus-os-status.txt
            sha256sum nexus-os-status.txt > SHA256SUMS.txt
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-build
          path: |
            build/*.iso
            build/SHA256SUMS.txt
          if-no-files-found: warn
